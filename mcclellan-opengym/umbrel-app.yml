manifestVersion: 1
id: mcclellan-opengym
name: openGym
tagline: Self-hosted gym and body-weight tracker
category: Health & Fitness
version: "1.2.11-4"

# Host-facing port that umbrelOS reserves for this app's proxy.
# If umbrelOS says the port is taken, change this number and reinstall.
port: 8095

description: >-
  openGym is a self-hosted gym and body-weight tracker. Plan routines, log
  workouts (supersets, warm-ups and cardio included), watch animated exercise
  demos, and chart your body weight over time.


  Sign-in uses passkeys, so there are no passwords to manage. Passkeys require
  a secure (HTTPS) origin — see this app store's README for the Cloudflare
  Tunnel setup that provides one.


  All data stays on your Umbrel in the app's own data directory.

developer: Duarte Santos
website: https://gitlab.com/DuarteSantos8/opengym
repo: https://gitlab.com/DuarteSantos8/opengym
support: https://gitlab.com/DuarteSantos8/opengym/-/issues
submitter: John Wakim
submission: https://gitlab.com/DuarteSantos8/opengym

releaseNotes: >-
  Moved from the Tailscale hostname to app.musclemary.co behind a Cloudflare
  Tunnel. This changes RP_ID, so any passkey registered under the old
  hostname no longer works and a new profile must be created.

dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
gallery: []
