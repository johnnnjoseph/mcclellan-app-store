services:
  # umbrelOS injects this service. It fronts the app on the port declared in
  # umbrel-app.yml and routes to APP_HOST:APP_PORT inside the app's network.
  app_proxy:
    environment:
      # Container name pattern is <app-id>_<service-name>_1
      APP_HOST: mcclellan-opengym_web_1
      APP_PORT: 80
      # openGym has its own passkey login, invite-only signup and guest mode
      # disabled below, so Umbrel's extra password prompt is turned off.
      # Set this to "true" if you'd rather have Umbrel's login in front as well.
      PROXY_AUTH_ADD: "false"

  # One-shot job: downloads the exercise image/GIF dataset (~140 MB) the first
  # time the app starts, then exits. Skipped on every start after that.
  # Media is (c) Gym visual, used under the upstream dataset's terms - see
  # NOTICE.md in the openGym repo. It is downloaded here, not redistributed.
  media:
    image: alpine/git:latest
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/out/img
      - ${APP_DATA_DIR}/data/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "Exercise media already present - skipping download."
        fi

  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data

      # ------------------------------------------------------------------
      # Passkey binding. These must exactly match the hostname you type in
      # the browser - WebAuthn passkeys are cryptographically bound to it.
      # Changing them later invalidates every passkey already registered.
      # ------------------------------------------------------------------
      RP_ID: "umbrel.taild4a659.ts.net"
      ORIGIN: "https://umbrel.taild4a659.ts.net"
      RP_NAME: "openGym"

      # BOOTSTRAP: signup is open so the first profile can be created. Invite
      # codes come from the admin dashboard, and you only become an admin after
      # registering, so INVITE_ONLY=1 on a fresh instance locks everyone out.
      #
      # Once your profile exists: read your id from data/app/db.json
      # ("users"[].id), set ADMIN_UIDS to it, flip INVITE_ONLY back to "1",
      # bump version: in umbrel-app.yml, push, and update the app.
      #
      #   ADMIN_UIDS: "your-user-id"
      INVITE_ONLY: "0"
      # No anonymous guest mode - a profile is the only way in.
      ALLOW_GUEST: "0"
    volumes:
      # Profiles, passkeys, workout history, session secret. BACK THIS UP.
      - ${APP_DATA_DIR}/data/app:/data
      # AI Coach provider credential cache. Deliberately a sibling of the data
      # directory so a live token never lands inside a backup of it. The Coach
      # is off unless an admin turns it on.
      - ${APP_DATA_DIR}/data/coach-auth:/coach-auth

  web:
    image: registry.gitlab.com/duartesantos8/opengym/web:latest
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      # The web image renders its nginx config at start-up from these, so no
      # rebuild is needed. BACKEND + PORT are what /api is proxied to.
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
      # Left empty on purpose: it drops the CF-Connecting-IP header so a direct
      # client cannot forge the address the activity log records. Only set this
      # if Cloudflare is genuinely in front of the app.
      CF_CONNECTING_IP: ""
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/data/media/gif:/usr/share/nginx/html/gif:ro
