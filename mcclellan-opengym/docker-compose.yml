services:
  # umbrelOS injects this service. It fronts the app on the port declared in
  # umbrel-app.yml and routes to APP_HOST:APP_PORT inside the app's network.
  app_proxy:
    environment:
      # Container name pattern is <app-id>_<service-name>_1
      APP_HOST: mcclellan-opengym_web_1
      APP_PORT: 80
      # openGym has its own passkey login and invite-only signup, so Umbrel's
      # extra password prompt is turned off. Set this to "true" if you'd rather
      # have Umbrel's login in front as well.
      PROXY_AUTH_ADD: "false"

  # One-shot job: downloads the exercise image/GIF dataset (~140 MB) the first
  # time the app starts, then exits. Skipped on every start after that.
  media:
    image: alpine/git:latest
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/out/img
      - ${APP_DATA_DIR}/data/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Downloading exercise media (~140 MB, one time)..."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "Exercise media already present - skipping download."
        fi

  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data

      # ------------------------------------------------------------------
      # EDIT THESE TWO LINES before installing.
      #
      # They must exactly match the hostname you type in the browser, because
      # WebAuthn passkeys are cryptographically bound to it. With Tailscale
      # Serve this is your Umbrel's MagicDNS name, e.g.:
      #     RP_ID:  umbrel.tail1a2b3c.ts.net
      #     ORIGIN: https://umbrel.tail1a2b3c.ts.net
      #
      # Changing these later invalidates every passkey already registered.
      # ------------------------------------------------------------------
      RP_ID: "umbrel.taild4a659.ts.net"
      ORIGIN: "https://umbrel.taild4a659.ts.net"

      RP_NAME: "openGym"
      # Require an invite code to create a new profile. Set to "0" to open
      # signup to anyone who can reach the app.
      INVITE_ONLY: "1"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/data/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/data/media/gif:/usr/share/nginx/html/gif:ro
